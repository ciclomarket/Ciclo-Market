services:
  - type: web
    name: mundobike-api
    env: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run server
    autoDeploy: true
    envVars:
      # CORS: allowed frontends (comma-separated)
      - key: FRONTEND_URL
        value: https://www.ciclomarket.ar,https://ciclomarket.ar

      # Supabase server credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Resend SMTP
      # Prefer API (HTTP) to avoid SMTP egress issues on PaaS
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        value: Ciclo Market <notificaciones@your-domain.com>
      # Renewal notifier (cron job to email sellers before expiry)
      - key: RENEWAL_NOTIFIER_ENABLED
        value: "false"
      - key: RENEWAL_REMINDER_TZ
        value: America/Argentina/Buenos_Aires
      - key: RENEWAL_REMINDER_CRON
        value: "0 * * * *"  # cada hora
      - key: RENEWAL_REMINDER_WINDOW_HOURS
        value: "24"         # buscar publicaciones que vencen en 24h
      - key: RENEWAL_REMINDER_COOLDOWN_HOURS
        value: "24"         # no reenviar dentro de 24h
      # Newsletter digest (últimos ingresos)
      - key: NEWSLETTER_DIGEST_ENABLED
        value: "false"
      - key: NEWSLETTER_DIGEST_TZ
        value: America/Argentina/Buenos_Aires
      - key: NEWSLETTER_DIGEST_CRON
        value: "0 21 * * 2" # martes 21:00

      # Review reminders (habilitar reseñas automáticamente y avisar 1 vez)
      - key: REVIEW_REMINDER_ENABLED
        value: "false"
      - key: REVIEW_REMINDER_TZ
        value: America/Argentina/Buenos_Aires
      - key: REVIEW_REMINDER_CRON
        value: "0 10 * * *"  # diario 10:00 (no reenvía)
      - key: REVIEW_REMINDER_BATCH_LIMIT
        value: "200"

      # Store analytics weekly digest (emails to stores)
      - key: STORE_ANALYTICS_DIGEST_ENABLED
        value: "false"
      - key: STORE_ANALYTICS_DIGEST_TZ
        value: America/Argentina/Buenos_Aires
      - key: STORE_ANALYTICS_DIGEST_CRON
        value: "0 10 * * 1"   # lunes 10:00

      # ===== EMAIL ENGINE (campañas v2) =====
      # 4 campañas activas: free_upgrade_offer, sold_followup,
      # new_arrivals_weekly (viernes 10:00) y whatsapp_upsell.
      # El orquestador corre 10:00 y 20:00 ARG; cada campaña decide su día/hora.
      - key: EMAIL_ENGINE_ENABLED
        value: "true"
      - key: EMAIL_ENGINE_CRON
        value: "0 10,20 * * *"
      # Los demás jobs de email quedan apagados
      - key: MARKETING_AUTOMATIONS_ENABLED
        value: "false"
      - key: MONDAY_NEW_ARRIVALS_ENABLED
        value: "false"
      - key: WEDNESDAY_UPDATE_ENABLED
        value: "false"
      - key: FRIDAY_UPGRADE_ENABLED
        value: "false"
      - key: SAVED_SEARCH_DIGEST_ENABLED
        value: "false"
      - key: EXTEND_EXPIRED_ENABLED
        value: "false"

      # ===== Brevo SMTP (300 emails/día) — reemplaza a Resend como envío principal =====
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: 98e027001@smtp-brevo.com
      - key: SMTP_FROM
        value: "Ciclo Market | El marketplace de ciclismo de Argentina <avisos@ciclomarket.ar>"
      # Secreto: setear en el dashboard de Render (no se commitea)
      - key: SMTP_PASSWORD
        sync: false

      # Precios de planes para los emails (alineados con la tabla `plans`)
      - key: AVAILABLE_PLANS
        value: '[{"code":"premium","name":"Plan Premium","price":9000},{"code":"pro","name":"Plan Pro","price":13000}]'

      # Optional
      - key: SHARE_FALLBACK_IMAGE
        value: https://your-domain.com/og-preview.png
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false

      # MercadoLibre import (POC)
      # Option A (recommended): app credentials (client_credentials)
      - key: MELI_CLIENT_ID
        sync: false
      - key: MELI_CLIENT_SECRET
        sync: false
      # Option B: manual access token (temporary / debugging)
      - key: MERCADOLIBRE_ACCESS_TOKEN
        sync: false

      # Instagram card generation — Supabase storage bucket for generated PNGs
      - key: INSTAGRAM_CARDS_BUCKET
        value: instagram-cards
